name: Desktop release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  make:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target_arch: x64
          - name: macOS arm64
            os: macos-14
            target_arch: arm64
          - name: macOS x64
            os: macos-15-intel
            target_arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            target_arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker and smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate source
        run: corepack pnpm check

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "draw-guess-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare Apple signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" ]]; then
            certificate_path="$RUNNER_TEMP/draw-guess-signing.p12"
            keychain_path="$RUNNER_TEMP/draw-guess-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            node -e \
              "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_BASE64, 'base64'))" \
              "$certificate_path"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
              -k "$keychain_path"
            security set-key-partition-list \
              -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s \
              "$keychain_path" \
              $(security list-keychains -d user | tr -d '"')
            echo "DRAW_GUESS_CI_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
            echo "DRAW_GUESS_CI_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"
          fi

      - name: Make installers and retain build log (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/out | Out-Null
          corepack pnpm desktop:make *>&1 |
            Tee-Object -FilePath apps/desktop/out/build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Make installers and retain build log (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p apps/desktop/out
          set -o pipefail
          corepack pnpm desktop:make 2>&1 |
            tee apps/desktop/out/build.log
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Launch packaged application
        if: runner.os != 'Linux'
        run: corepack pnpm desktop:smoke

      - name: Launch packaged application on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a corepack pnpm desktop:smoke

      - name: Remove temporary Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "draw-guess-signing.pfx"
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${DRAW_GUESS_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DRAW_GUESS_CI_KEYCHAIN" || true
            rm -f -- "$DRAW_GUESS_CI_KEYCHAIN"
          fi
          if [[ -n "${DRAW_GUESS_CI_CERTIFICATE:-}" ]]; then
            rm -f -- "$DRAW_GUESS_CI_CERTIFICATE"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-guess-${{ runner.os }}-${{ matrix.target_arch }}
          path: |
            apps/desktop/out/make/**
            apps/desktop/out/SHA256SUMS.txt
            apps/desktop/out/build.log
          if-no-files-found: error

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Prepare user downloads and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          while IFS= read -r -d '' artifact; do
            relative="${artifact#release-input/}"
            platform="${relative%%/*}"
            filename="$(basename "$artifact")"
            platform_slug="$(
              printf '%s' "${platform#draw-guess-}" |
                tr '[:upper:]' '[:lower:]'
            )"
            extension="${filename##*.}"
            suffix=""
            if [[ "$filename" == "DrawGuessSetup.exe" ]]; then
              suffix="-setup"
            fi
            target="release-files/draw-guess-${GITHUB_REF_NAME#v}-${platform_slug}${suffix}.${extension}"
            if [[ -e "$target" ]]; then
              echo "Duplicate release target: $target" >&2
              exit 1
            fi
            cp -- "$artifact" "$target"
          done < <(
            find release-input -type f \
              \( -iname '*.exe' -o -iname '*.zip' -o -iname '*.dmg' \
                 -o -iname '*.deb' -o -iname '*.rpm' \) \
              -print0
          )

          if ! find release-files -type f -print -quit | grep -q .; then
            echo "No user-facing release files were produced." >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Write user release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf '这是 **%s** 的预发布测试版，建议先在小范围游戏中体验并反馈问题。\n' "$version"
            cat <<'EOF'

          ## 更清晰的游戏界面

          - 顶部栏现在只保留品牌、房间码、当前模式/阶段、连接状态和一个“更多”入口，在 1024px 与手机宽度下不再堆满操作按钮。
          - 首页突出“创建房间”和“加入房间”；大厅集中模式、本局设置、玩家状态和开始游戏；游戏页面只显示当前阶段真正可用的操作。
          - Pass、暂停、本局设置和返回大厅合并到当前阶段操作栏，不适用或无权限的按钮不会大量以禁用状态出现。
          - 房间码只显示一次；词库、通知、回放和退出等辅助功能进入统一的“更多”菜单。

          ## 统一桌面控制中心

          - Electron 顶部不再平铺“联机、采集、设置、诊断”四个按钮，只保留一个控制中心入口。
          - 控制中心内部以侧边分区切换联机服务、画布采集、偏好设置和脱敏诊断，同一时间只重点展示一个面板。
          - 大厅只保留采集状态摘要和必要的采集设置入口；关闭控制中心后游戏画面恢复专注布局。
          - 远程玩家不会看到本机服务管理；实际主机的服务重启、密码修改和关闭房间仍集中在联机面板。

          ## 主动退出与界面可靠性

          - 主动退出会立即清理会话和房间成员，不再被当作可重连的临时断线；房主退出会按既有规则关闭房间。
          - 桌面应用正常退出前会尽力通知房间服务器，并始终清理本地连接与会话。
          - 参考图画廊会把大图限制在卡片和视口内；主题修复入口只在检测到实际主题异常时出现。
          - 默认视觉改用一致的间距、轻边框、柔和阴影、状态 Badge 和主次/危险按钮层级，并遵守减少动画偏好。

          ## 兼容性

          - 游戏网络协议继续为 v5，设置 schema、主题 API 1 与房间码格式均未改变。
          - 现有 `data-ui`、`data-action`、`data-critical-*` 主题与安全钩子继续保留。
          - 经典你画我猜、参考图临摹、绘画接龙、主机暂停、Pass、采集、头像、词库、通知和 FFmpeg 回放能力保持可用。

          ## 下载与使用

          - Windows x64：下载 `.exe` 安装程序或 `.zip` 便携包。
          - macOS：Apple 芯片请选择 arm64，Intel Mac 请选择 x64。
          - Linux x64：可选择 `.deb`、`.rpm` 或 `.zip`。
          - 绘画接龙只有负责开房的主机需要自行安装 FFmpeg；其他玩家不需要。
          - 当前连接输入保证 IPv4 和 DNS 名称；IPv6 输入会收到明确的不支持提示。
          - 这是预发布版本，安装时可能出现系统安全提醒。重要游戏前建议先创建测试房间，确认采集、防火墙和实际网络连接正常。

          `SHA256SUMS.txt` 可用于核对下载文件是否完整。
          EOF
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "画猜现场 ${GITHUB_REF_NAME#v} 预发布版" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --verify-tag
