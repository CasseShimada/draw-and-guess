name: Desktop release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  make:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target_arch: x64
          - name: macOS arm64
            os: macos-14
            target_arch: arm64
          - name: macOS x64
            os: macos-15-intel
            target_arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            target_arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker and smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate source
        run: corepack pnpm check

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "draw-guess-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare Apple signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" ]]; then
            certificate_path="$RUNNER_TEMP/draw-guess-signing.p12"
            keychain_path="$RUNNER_TEMP/draw-guess-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            node -e \
              "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_BASE64, 'base64'))" \
              "$certificate_path"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
              -k "$keychain_path"
            security set-key-partition-list \
              -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s \
              "$keychain_path" \
              $(security list-keychains -d user | tr -d '"')
            echo "DRAW_GUESS_CI_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
            echo "DRAW_GUESS_CI_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"
          fi

      - name: Make installers and retain build log (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/out | Out-Null
          corepack pnpm desktop:make *>&1 |
            Tee-Object -FilePath apps/desktop/out/build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Make installers and retain build log (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p apps/desktop/out
          set -o pipefail
          corepack pnpm desktop:make 2>&1 |
            tee apps/desktop/out/build.log
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Launch packaged application
        if: runner.os != 'Linux'
        run: corepack pnpm desktop:smoke

      - name: Launch packaged application on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a corepack pnpm desktop:smoke

      - name: Remove temporary Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "draw-guess-signing.pfx"
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${DRAW_GUESS_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DRAW_GUESS_CI_KEYCHAIN" || true
            rm -f -- "$DRAW_GUESS_CI_KEYCHAIN"
          fi
          if [[ -n "${DRAW_GUESS_CI_CERTIFICATE:-}" ]]; then
            rm -f -- "$DRAW_GUESS_CI_CERTIFICATE"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-guess-${{ runner.os }}-${{ matrix.target_arch }}
          path: |
            apps/desktop/out/make/**
            apps/desktop/out/SHA256SUMS.txt
            apps/desktop/out/build.log
          if-no-files-found: error

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Prepare user downloads and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          while IFS= read -r -d '' artifact; do
            relative="${artifact#release-input/}"
            platform="${relative%%/*}"
            filename="$(basename "$artifact")"
            platform_slug="$(
              printf '%s' "${platform#draw-guess-}" |
                tr '[:upper:]' '[:lower:]'
            )"
            extension="${filename##*.}"
            suffix=""
            if [[ "$filename" == "DrawGuessSetup.exe" ]]; then
              suffix="-setup"
            fi
            target="release-files/draw-guess-${GITHUB_REF_NAME#v}-${platform_slug}${suffix}.${extension}"
            if [[ -e "$target" ]]; then
              echo "Duplicate release target: $target" >&2
              exit 1
            fi
            cp -- "$artifact" "$target"
          done < <(
            find release-input -type f \
              \( -iname '*.exe' -o -iname '*.zip' -o -iname '*.dmg' \
                 -o -iname '*.deb' -o -iname '*.rpm' \) \
              -print0
          )

          if ! find release-files -type f -print -quit | grep -q .; then
            echo "No user-facing release files were produced." >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Write user release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf '这是 **%s** 的预发布测试版，建议先在小范围游戏中体验并反馈问题。\n' "$version"
            cat <<'EOF'

          ## 昵称与房间身份

          - 创建房间和加入房间时昵称现在可以留空；服务端会为每次请求重新生成“形容词 + 名词 + `#四位数字`”身份。
          - 随机昵称会避开当前房间内已经使用的昵称主体，并轮换最近生成的主体，避免每位首个玩家反复获得同一个名字。
          - 手动输入的昵称会在本机记住，下次创建或加入房间时自动填入；留空生成随机昵称不会覆盖已记住的手动昵称。
          - 昵称仍统一经过规范化、控制字符过滤、长度限制和房间内唯一数字后缀处理。

          ## 经典模式选词修复

          - 服务端现在先同步“当前画手与回合”快照，再向画手发送私密候选词，客户端不会再把有效候选词误判为过期消息。
          - 选词成功后的私密题目改为按新的绘画步骤校验，不再错误沿用选词阶段 ID。
          - 首次开局、Pass 换画手、倒计时自动选词和重连恢复使用同一套有序消息链路。
          - 候选词状态更新不再重建 WebSocket 订阅，避免选词时发生无意义重连。

          ## 兼容性与既有功能

          - 游戏网络协议继续为 v5，设置 schema、主题 API 与房间码格式均未改变。
          - v0.5.8 的 CSS 主题、运行中房间设置、联机诊断、关闭房间通知和顶部桌面工具栏继续保留。
          - 经典你画我猜、参考图临摹、绘画接龙、主机暂停、Pass、采集、头像、词库和 FFmpeg 回放能力保持可用。

          ## 下载与使用

          - Windows x64：下载 `.exe` 安装程序或 `.zip` 便携包。
          - macOS：Apple 芯片请选择 arm64，Intel Mac 请选择 x64。
          - Linux x64：可选择 `.deb`、`.rpm` 或 `.zip`。
          - 绘画接龙只有负责开房的主机需要自行安装 FFmpeg；其他玩家不需要。
          - 当前连接输入保证 IPv4 和 DNS 名称；IPv6 输入会收到明确的不支持提示。
          - 这是预发布版本，安装时可能出现系统安全提醒。重要游戏前建议先创建测试房间，确认采集、防火墙和实际网络连接正常。

          `SHA256SUMS.txt` 可用于核对下载文件是否完整。
          EOF
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "画猜现场 ${GITHUB_REF_NAME#v} 预发布版" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --verify-tag
