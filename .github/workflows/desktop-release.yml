name: Desktop release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  make:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target_arch: x64
          - name: macOS arm64
            os: macos-14
            target_arch: arm64
          - name: macOS x64
            os: macos-15-intel
            target_arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            target_arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker and smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate source
        run: corepack pnpm check

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "draw-guess-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare Apple signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" ]]; then
            certificate_path="$RUNNER_TEMP/draw-guess-signing.p12"
            keychain_path="$RUNNER_TEMP/draw-guess-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            node -e \
              "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_BASE64, 'base64'))" \
              "$certificate_path"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
              -k "$keychain_path"
            security set-key-partition-list \
              -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s \
              "$keychain_path" \
              $(security list-keychains -d user | tr -d '"')
            echo "DRAW_GUESS_CI_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
            echo "DRAW_GUESS_CI_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"
          fi

      - name: Make installers and retain build log (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/out | Out-Null
          corepack pnpm desktop:make *>&1 |
            Tee-Object -FilePath apps/desktop/out/build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Make installers and retain build log (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p apps/desktop/out
          set -o pipefail
          corepack pnpm desktop:make 2>&1 |
            tee apps/desktop/out/build.log
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Launch packaged application
        if: runner.os != 'Linux'
        run: corepack pnpm desktop:smoke

      - name: Launch packaged application on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a corepack pnpm desktop:smoke

      - name: Remove temporary Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "draw-guess-signing.pfx"
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${DRAW_GUESS_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DRAW_GUESS_CI_KEYCHAIN" || true
            rm -f -- "$DRAW_GUESS_CI_KEYCHAIN"
          fi
          if [[ -n "${DRAW_GUESS_CI_CERTIFICATE:-}" ]]; then
            rm -f -- "$DRAW_GUESS_CI_CERTIFICATE"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-guess-${{ runner.os }}-${{ matrix.target_arch }}
          path: |
            apps/desktop/out/make/**
            apps/desktop/out/SHA256SUMS.txt
            apps/desktop/out/build.log
          if-no-files-found: error

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Prepare user downloads and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          while IFS= read -r -d '' artifact; do
            relative="${artifact#release-input/}"
            platform="${relative%%/*}"
            filename="$(basename "$artifact")"
            platform_slug="$(
              printf '%s' "${platform#draw-guess-}" |
                tr '[:upper:]' '[:lower:]'
            )"
            extension="${filename##*.}"
            suffix=""
            if [[ "$filename" == "DrawGuessSetup.exe" ]]; then
              suffix="-setup"
            fi
            target="release-files/draw-guess-${GITHUB_REF_NAME#v}-${platform_slug}${suffix}.${extension}"
            if [[ -e "$target" ]]; then
              echo "Duplicate release target: $target" >&2
              exit 1
            fi
            cp -- "$artifact" "$target"
          done < <(
            find release-input -type f \
              \( -iname '*.exe' -o -iname '*.zip' -o -iname '*.dmg' \
                 -o -iname '*.deb' -o -iname '*.rpm' \) \
              -print0
          )

          if ! find release-files -type f -print -quit | grep -q .; then
            echo "No user-facing release files were produced." >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Write user release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf '这是 **%s** 的预发布测试版，建议先在小范围游戏中体验并反馈问题。\n' "$version"
            cat <<'EOF'

          ## 房间控制与联机升级

          - 游戏进行中，逻辑房主可用顶部“返回房间”打开仅本地可见的设置页；其他玩家继续游戏，服务器计时与桌面采集不会因页面切换暂停。
          - 三种模式设置已抽成大厅和运行中设置页共用的输入组件；草稿不会被普通快照覆盖，离开脏草稿会明确确认。
          - “应用并重启游戏”使用协议 v5 的单个原子 `game:restart` 命令，不再串联返回大厅、保存设置与开始游戏。
          - 同模式重启保留成员、房主、聊天、密码、头像、词库和参考图，同时清除旧分数、回合、投票、结果、帧、采集授权、actor step、mode session 与计时器。
          - 新游戏启动条件不足时会安全停留在保留新设置的真实大厅；暂停状态下也可直接重启并退出暂停。
          - 绘画接龙重启复用模式切换的部分回放选择，可编码保存或明确丢弃。
          - 切换到不同模式仍使用 `room:switch-mode`，保留成员和模式偏好，进入目标模式真实大厅且不自动开局。
          - “联机 / 采集 / 设置 / 诊断”已从右下角悬浮条移入大厅和房间的顶部操作区，不再遮挡提示、表单或关闭房间按钮。
          - 大厅中的重复“玩家连接信息”模块已移除；监听端口、网卡、公网映射、房间密码和关闭房间操作统一放在“联机”页。
          - “联机”页使用更宽的专用面板、更大的正文与表单字号，以及清晰的本机、公网和房间分区。
          - 采集工作室的裁切按钮为启用态和禁用态提供明确的高对比配色，不再出现浅色背景配浅色文字。
          - 房主关闭房间时，其他玩家会立即看到不可忽略的原因对话框；玩家点击“确定并返回主界面”后才清理当前画面。
          - 房主正常退出程序时，服务器会先向在线玩家广播“房主已退出，房间服务已停止”及终止关闭码，再关闭 WebSocket 与进程。
          - 房间码仍只保留在左上角品牌区，点击即可复制；普通玩家进入远程房间后仍无法访问房主联机设置。
          - 实际主机仍可在“联机”页修改房间密码或关闭房间；关闭主窗口默认退出整个应用。
          - 昵称唯一后缀、加入失败诊断、固定端口、局域网绑定、公网转发和明文 HTTP 风险确认保持可用。

          ## 兼容性与玩法

          - 应用版本与当前发布标签一致，设置 schema 为 6；游戏协议升级为 v5，旧 v4 客户端会收到明确的不兼容提示。
          - 经典你画我猜、参考图临摹和绘画接龙三种玩法保持可用。
          - 主机暂停、Pass、展示收尾、采集、头像、词库、本地主题和 FFmpeg 回放能力保持不变。

          ## 下载与使用

          - Windows x64：下载 `.exe` 安装程序或 `.zip` 便携包。
          - macOS：Apple 芯片请选择 arm64，Intel Mac 请选择 x64。
          - Linux x64：可选择 `.deb`、`.rpm` 或 `.zip`。
          - 绘画接龙只有负责开房的主机需要自行安装 FFmpeg；其他玩家不需要。
          - 当前连接输入保证 IPv4 和 DNS 名称；IPv6 输入会收到明确的不支持提示。
          - 这是预发布版本，安装时可能出现系统安全提醒。重要游戏前建议先创建测试房间，确认采集、防火墙和实际网络连接正常。

          `SHA256SUMS.txt` 可用于核对下载文件是否完整。
          EOF
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "画猜现场 ${GITHUB_REF_NAME#v} 预发布版" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --verify-tag
